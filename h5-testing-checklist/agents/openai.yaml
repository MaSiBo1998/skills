interface:
  display_name: "测试验收"
  short_description: "先查再问地收集输入，记录 checkpoint，并执行交付验收、场景专项检查和工作流巡检评估"
  default_prompt: "使用 h5-testing-checklist 验证本次改动：输入收集必须先从代码、配置、文档、design 目录、release-env 和 checkpoint 推断事实，只询问阻塞项；将 discovered_facts、assumptions、blocking_questions、scene_confidence、selected_scene_reason 和 skipped_skills 写入 checkpoint。按 focused/full/release 验收等级输出通过/失败清单；本次涉及接口/字段替换时检查映射完整性，普通首复贷需求不强制检查项目适配映射；首复贷接口文档、用户示例或现有类型已明确字段结构时，必须检查页面按固定结构直接取值或解析，未引入复杂通用兜底、字段探测、多层 helper 或本地业务文案替代接口文案；按设计图改首复贷状态页时必须检查既有 banner、轮询、bridge 跳转、按钮回调、刷新逻辑、埋点和兜底展示未因截图缺失被误删，且只影响目标状态分支；首复贷还款/支付过渡页必须检查外链、非 URL 凭证复制兜底、空字符串渠道提示、服务费展示、渠道图标资源、顶部返回和 window.onNativeBack 同入口，以及真实 WebView 待验项；旧 WebView CSS 兼容必须检查 gap/row-gap/column-gap 残留和 safe-area 固定值、constant()、env() 分层兜底；首复贷 banner 必须检查内跳参数按接口原值透传 bridge；官网/协议/挂载 H5、管理后台、飞书前端告警和 K 未知/复合需求回落场景按对应专项验收补充检查；场景 H 必须验收 spec-driven-development 轻量规格、workflow-orchestration-patterns 编排审查、llm-evaluation 回归样例、动态通过线、automation memory 读写、未解析 CODEX_HOME memory 路径回退、checkpoint 自动续跑/保留策略；回归计数只统计 ## 评估样例 区段，不能把 ## 输出格式 等说明表计入样例数，且按排除表头和分隔行后的数据行统计，不要求首列是编号；文件发现递归覆盖 SKILL.md、references/*.md、agents/openai.yaml 和隐藏/被 ignore 的 .agents/skills 辅助 skill 且记录分类计数；若使用 rg，必须有 --hidden、--no-ignore、排除 .git 的 glob 和 **/ 递归 glob，不能因 .gitignore 或窄 glob 导致 reference/openai 计数为 0；内部引用扫描无脚本错误或污染输出、未解析 CODEX_HOME 模板路径、正则裁剪后的 CODEX_HOME/... 片段、斜杠分隔的概念标签/枚举/比例/尺寸、文件发现 glob、可选校验 runner fallback、已发现辅助 skill 的说明性导航和跨 skill 导航引用未被误报为缺失引用、运行时 hash 比对命令无脚本错误，且 .agents/skills/<skill> 源路径已归一化为 <runtime>/<skill> 后再判定漂移或缺失；若运行时同步被权限阻断，列出经无错误 hash 比对确认的漂移文件和受阻目录作为外部阻塞。交付时说明自动推断、执行链、跳过原因、待验收项、巡检辅助结果和规则沉淀结果。"
