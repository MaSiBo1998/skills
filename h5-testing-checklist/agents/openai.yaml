interface:
  display_name: "测试验收"
  short_description: "先查再问地收集输入，记录 checkpoint，并执行交付验收、场景专项检查和工作流巡检评估"
  default_prompt: >-
    使用 h5-testing-checklist 验证本次改动：输入收集必须先从代码、配置、文档、design 目录、release-env 和 checkpoint 推断事实，只询问阻塞项；将 discovered_facts、assumptions、blocking_questions、scene_confidence、selected_scene_reason 和 skipped_skills 写入 checkpoint。按 quick/focused/full/release 验收等级输出通过/失败/跳过清单；纯样式数值、文案、单文件 CSS、静态展示微调且不触及 JS/TS 逻辑、接口、路由、原生桥、构建配置、样式入口、资源加载或发布时使用 quick，只做目标 diff、相关静态搜索和局部风险抽查，不默认跑 type-check/build；触及 TS/JS、组件导入导出、原生调用点、样式入口/适配策略/资源加载时使用 focused 并执行相关最小命令；接口、主流程、公共工具、构建配置、发布前使用 full/release。任意 H5 项目或页面改动都必须按当前等级执行 H5 基础质量检查：默认以 375px 宽设计图为基准，检查源码 CSS/SCSS 保留设计稿 px、入口 setRem 设置根字号、构建阶段 px-to-rem 输出 rem、运行时 JS 动态尺寸使用同一基准转换、无理由屏幕尺寸 @media 残留、样式按 base/layout/components/pages 等职责拆分、入口 import 清晰、首屏同步重依赖和大包提醒说明。任意 App 内嵌 H5、App WebView 入口、官网域名挂载给 App 打开的 H5 都要考虑 WebView 兼容；quick 只检查本次 diff 是否新增风险，focused/full/release 再执行对应范围专项：检查 legacy/nomodule 或等价旧包、polyfill、旧 WebView 常缺 API 降级、vConsole/监控/埋点/音频等辅助能力不阻塞首屏、gap/row-gap/column-gap 残留、aspect-ratio fallback、safe-area 固定值/constant()/env() 分层兜底，并列出真实 App WebView 待验项。本次涉及接口/字段替换时检查映射完整性，普通首复贷需求不强制检查项目适配映射；首复贷接口文档、用户示例或现有类型已明确字段结构时，必须检查页面按固定结构直接取值或解析，未引入复杂通用兜底、字段探测、多层 helper 或本地业务文案替代接口文案；按设计图改首复贷状态页时必须检查既有 banner、轮询、bridge 跳转、按钮回调、刷新逻辑、埋点和兜底展示未因截图缺失被误删，且只影响目标状态分支；首复贷还款/支付过渡页必须检查外链、非 URL 凭证复制兜底、空字符串渠道提示、服务费展示、渠道图标资源、顶部返回和 window.onNativeBack 同入口，以及真实 WebView 待验项；首复贷 banner 必须检查内跳参数按接口原值透传 bridge；官网/协议/挂载 H5、管理后台、飞书前端告警和 K 未知/复合需求回落场景按对应专项验收补充检查；场景 H 必须验收 spec-driven-development 轻量规格、workflow-orchestration-patterns 编排审查、llm-evaluation 回归样例、动态通过线、automation memory 读写、未解析 CODEX_HOME memory 路径回退、checkpoint 自动续跑/保留策略；回归计数只统计 ## 评估样例 区段，不能把 ## 输出格式 等说明表计入样例数，且按排除表头和分隔行后的数据行统计，不要求首列是编号；文件发现递归覆盖 SKILL.md、references/*.md、agents/openai.yaml 和隐藏/被 ignore 的 .agents/skills 辅助 skill 且记录分类计数；若使用 rg，必须有 --hidden、--no-ignore、排除 .git 的 glob 和 **/ 递归 glob，不能因 .gitignore 或窄 glob 导致 reference/openai 计数为 0；内部引用扫描无脚本错误或污染输出、未解析 CODEX_HOME 模板路径、正则裁剪后的 CODEX_HOME/... 片段、斜杠分隔的概念标签/枚举/比例/尺寸、文件发现 glob、可选校验 runner fallback、已发现辅助 skill 的说明性导航和跨 skill 导航引用未被误报为缺失引用、运行时 hash 比对命令无脚本错误，且 .agents/skills/<skill> 源路径已归一化为 <runtime>/<skill> 后再判定漂移或缺失；若运行时同步被权限阻断，列出经无错误 hash 比对确认的漂移文件和受阻目录作为外部阻塞。交付时说明自动推断、执行链、跳过原因、待验收项、巡检辅助结果和规则沉淀结果。
