interface:
  display_name: "测试验收"
  short_description: "先查再问地收集输入，记录 checkpoint，并执行交付验收、场景专项检查和工作流巡检评估"
  default_prompt: "使用 h5-testing-checklist 验证本次改动：输入收集必须先从代码、配置、文档、design 目录、release-env 和 checkpoint 推断事实，只询问阻塞项；将 discovered_facts、assumptions、blocking_questions、scene_confidence、selected_scene_reason 和 skipped_skills 写入 checkpoint。按 focused/full/release 验收等级输出通过/失败清单；本次涉及接口/字段替换时检查映射完整性，普通首复贷需求不强制检查项目适配映射；官网/协议/挂载 H5、管理后台、飞书前端告警和 K 未知/复合需求回落场景按对应专项验收补充检查；场景 H 必须验收 spec-driven-development 轻量规格、workflow-orchestration-patterns 编排审查、llm-evaluation 回归样例和失败项处理；交付时说明自动推断、执行链、跳过原因、待验收项、巡检辅助结果和规则沉淀结果。"
