interface:
  display_name: "工作流自我更新成长"
  short_description: "自动识别可沉淀经验并更新对应工作流规则"
  default_prompt: "使用 workflow-self-improvement 判断本次经验是否需要沉淀到主工作流或子 skill；明确、可复用、归属清晰的规则默认直接修改和校验，不等待用户再次确认；用户要求一轮一轮巡检时，一轮表示本次范围内全部 skill 检查、优化、校验并同步完成；新增 skill 或调整 skill 调度链接后，同步到 Trae/Codex/Claude 运行时目录；飞书前端告警、白屏监控、线上异常预警归属 h5-feishu-alert。"
