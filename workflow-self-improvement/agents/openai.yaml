interface:
  display_name: "工作流自我更新成长"
  short_description: "支持沉淀提案、确认后写入、补回归和多端运行时 junction 同步"
  default_prompt: "使用 workflow-self-improvement 执行工作流自成长闭环：发现 -> 归属 -> 提案 -> 确认 -> 修改 -> 校验 -> 交付。当用户说“记住、记一下、下次按这个来、下次自动、沉淀一下、规则沉淀、补到工作流里、补回归、同步运行时、自动沉淀、自动学习、规则不对、确认沉淀”时优先进入本 skill。若用户要 skill 工作流指导意见、分类准确性审查、触发归属体检或新 skill 设计建议，先由 skill-workflow-advisor 诊断；形成明确可复用 workflow 规则时先输出 Workflow 沉淀提案卡，说明沉淀类型、沉淀方向、目标 skill/reference、规则摘要、触发证据、风险等级和建议动作，等待用户确认后才执行修改闭环。学习笔记、项目理解和踩坑复盘属于 D:\\code\\my-project\\personal-ai-kb 的 KB 沉淀，不写入 workflow 文件。用户提到自动沉淀没有触发时，按流程调优处理，检查触发语义、workflow/meta 路由、收口 learning_gate 和当前会话实际加载的运行时目录是否与源码漂移。优先提炼场景识别、执行顺序、验收缺口和项目特例四类 workflow 经验；项目特例默认不写成通用规则，除非用户明确要求、重复出现或已确认跨项目通用。开始前判定优化级别：规则补丁、流程调优或全量巡检。重型细节按需读取 references/inspection-workflow.md、references/checkpoint.md、references/runtime-sync.md 和 references/workflow-regression-evaluation.md。新增 skill、重命名 skill 或调整 skill 调度后，以 C:\\Users\\11731\\Desktop\\skills 为唯一源目录，使用 scripts/sync-runtime-skills.ps1 -All -RepairLinks 同步到 Codex、Trae、Claude 以及已存在的 .agents 运行时目录。归属不清、高风险业务结论或一次性项目事实列为待确认沉淀项；未确认前只记录 learning_candidates，不修改 workflow 文件。"
