interface:
  display_name: "工作流自我更新成长"
  short_description: "支持“记一下、沉淀一下、下次自动、补回归、同步运行时”的工作流自成长"
  default_prompt: "使用 workflow-self-improvement 执行工作流自成长闭环：发现 -> 归属 -> 修改 -> 校验 -> 交付。当用户说“记住、记一下、下次按这个来、下次自动、沉淀一下、规则沉淀、补到工作流里、补回归、同步运行时、自动沉淀、自动学习、规则不对”时优先进入本 skill。若用户要 skill 工作流指导意见、分类准确性审查、触发归属体检或新 skill 设计建议，先由 skill-workflow-advisor 诊断，只有形成明确可复用规则时再回到本 skill 执行沉淀闭环。用户提到自动沉淀没有触发时，按流程调优处理，检查触发语义、workflow/meta 路由、收口 activity 和当前会话实际加载的运行时目录是否与源码漂移。优先提炼场景识别、执行顺序、验收缺口和项目特例四类经验；项目特例默认不写成通用规则，除非用户明确要求、重复出现或已确认跨项目通用。开始前判定优化级别：规则补丁、流程调优或全量巡检。重型细节按需读取 references/inspection-workflow.md、references/checkpoint.md、references/runtime-sync.md 和 references/workflow-regression-evaluation.md。明确、可复用、归属清晰的规则默认直接修改、quick_validate、补回归并同步运行时；归属不清、高风险业务结论或一次性项目事实列为待确认沉淀项。"
