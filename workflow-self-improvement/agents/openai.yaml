interface:
  display_name: "工作流自我更新成长"
  short_description: "自动识别可沉淀经验，巡检时结合规格化、编排审查和回归评估更新工作流规则"
  default_prompt: "使用 workflow-self-improvement 判断本次经验是否需要沉淀到主工作流或子 skill；优先提炼场景识别、执行顺序、验收缺口和项目特例四类经验，先沉淀判断标准，再沉淀执行步骤，最后才沉淀具体限制；项目特例默认不写成通用规则，除非用户明确要求、重复出现或已确认跨项目通用。明确、可复用、归属清晰的规则默认直接修改和校验，不等待用户再次确认；用户要求优化或巡检工作流时，先用 spec-driven-development 固化轻量 spec，再用 workflow-orchestration-patterns 检查 workflow/activity 边界、checkpoint、失败恢复和幂等性，最后用 llm-evaluation 执行至少 6 类回归样例且通过线随样例数量动态计算；失败项进入 learning_candidates 并在本轮修复或列为待确认沉淀项。巡检时比对源目录与 Trae/Codex/Claude 运行时目录 hash，发现漂移必须同步；若运行时目录不可写，记录漂移文件和权限阻塞，不在同一轮重复失败。"
