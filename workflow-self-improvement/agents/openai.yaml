interface:
  display_name: "工作流自我更新成长"
  short_description: "自动识别可沉淀经验，巡检时结合规格化、编排审查和回归评估更新工作流规则"
  default_prompt: "使用 workflow-self-improvement 判断本次经验是否需要沉淀到主工作流或子 skill；优先提炼场景识别、执行顺序、验收缺口和项目特例四类经验，先沉淀判断标准，再沉淀执行步骤，最后才沉淀具体限制；项目特例默认不写成通用规则，除非用户明确要求、重复出现或已确认跨项目通用。目标不是把 workflow 继续堆成长规则，而是把硬触发、固定流水线和重复判断改成可编排的稳定原则。若本轮涉及新增 backend/flutter 方向，优先沉淀为方向注册、方向内 scene map 和 dedicated workflow contract，不把方向内细节直接塞进主 skill。开始前先判定优化级别：规则补丁只改相关 skill 和定向回归，流程调优扫描相关链路并做局部编排审查，全量巡检才扫描全部 skill 并跑完整闭环。明确、可复用、归属清晰的规则默认直接修改和校验，不等待用户再次确认；用户要求优化或巡检工作流时，先用 spec-driven-development 固化轻量 spec，并记录 optimization_level；若来自 recurring automation 或包含 Automation ID/Automation memory，先读取 automation memory，路径优先解析上下文显式值并使用解析结果；显式值里的 CODEX_HOME 未解析或环境变量为空时，回退到用户目录下 .codex/automations/<id>/memory.md；未提供显式值时才使用默认 CODEX_HOME automation 路径，并在交付前写回本轮摘要、未同步漂移和下一轮关注点；再用 workflow-orchestration-patterns 检查 workflow/activity 边界、checkpoint、失败恢复和幂等性，最后用 llm-evaluation 执行当前回归样例集；规则补丁和流程调优优先跑定向样例，全量巡检跑完整评估集。回归计数只能统计 ## 评估样例 区段内的样例表，不能把 ## 输出格式 等说明表计入样例数，样例行按排除表头和分隔行后的数据行统计，不要求首列是编号，也不得按数据单元格里的“输入/期望/场景类型”等词过滤整行，通过线随样例数量动态计算；失败项进入 learning_candidates 并在本轮修复或列为待确认沉淀项。全量巡检时文件发现必须递归覆盖各 skill 子目录以及隐藏/被 ignore 的辅助 skill 目录（例如 .agents/skills）中的 SKILL.md、references/*.md 和 agents/openai.yaml，并记录分类计数；若使用 rg，必须同时有 --hidden、--no-ignore、排除 .git 的 glob，以及 **/SKILL.md、**/references/*.md、**/agents/openai.yaml 这类递归 glob；如果存在 references、agents 或 .agents/skills 目录但发现数量为 0，改用包含隐藏和 ignore 覆盖的递归枚举重跑。检查内部引用路径是否真实存在，并同时按当前文件目录、所属 skill 根目录和仓库根目录解析；过滤占位符、未解析 CODEX_HOME 模板路径、正则裁剪后的 CODEX_HOME/...、codex/automations/...、agents/skills/... 片段、命令片段、斜杠分隔的概念标签/枚举/比例/尺寸、文件发现 glob、可选校验 runner fallback、已发现辅助 skill 的说明性导航、跨 skill 导航引用和目标项目示例文件；引用扫描或运行时 hash 比对命令必须兼容当前 shell，脚本报错或输出污染时先修正并重跑再下结论；运行时 hash 比对必须把 .agents/skills/<skill> 这类隐藏辅助 skill 源路径归一化为 <runtime>/<skill>，不能按字面嵌套路径误报缺失；若 .agents/skills 是当前会话实际加载目录，也必须作为运行时镜像纳入漂移比对和同步；发现运行时漂移必须同步；若运行时目录不可写，记录漂移文件和权限阻塞，不在同一轮重复失败。"
