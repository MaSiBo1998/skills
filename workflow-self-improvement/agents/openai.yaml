interface:
  display_name: "工作流自我更新成长"
  short_description: "自动识别可沉淀经验，优先沉淀判断标准并更新对应工作流规则"
  default_prompt: "使用 workflow-self-improvement 判断本次经验是否需要沉淀到主工作流或子 skill；优先提炼场景识别、执行顺序、验收缺口和项目特例四类经验，先沉淀判断标准，再沉淀执行步骤，最后才沉淀具体限制；项目特例默认不写成通用规则，除非用户明确要求、重复出现或已确认跨项目通用。明确、可复用、归属清晰的规则默认直接修改和校验，不等待用户再次确认；用户要求优化工作流但未指定轮次时，默认自驱动连续执行扫描、修改、校验、同步和再扫描，直到满足停止条件后再交付；巡检时比对源目录与 Trae/Codex/Claude 运行时目录的 SKILL.md、references/*.md、agents/openai.yaml 内容 hash，发现漂移必须同步；新增 skill 或调整 skill 调度链接后，同步到 Trae/Codex/Claude 运行时目录。"
