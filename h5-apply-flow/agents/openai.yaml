interface:
  display_name: "H5 进件流程"
  short_description: "开发 H5 进件申请流程"
  default_prompt: "使用 h5-apply-flow 开发或修改 H5 进件申请流程；先读取 references/flow-variants.md 判断旧流程还是新流程，旧流程参考 D:\\code\\H5\\Crediapoyo\\crediapoyo-step-app，新流程参考 D:\\code\\H5\\Confiq\\confiq-h5；参考项目不可用时不阻断，按抽象合同和目标项目证据执行。进件是业务场景，可能是独立 H5，也可能是 App 内嵌 H5，只有出现原生方法、bridge 或 window 回调证据时才判定为 App 内嵌；涉及原生方法交互时遵守 references/native-methods.md，未主动说明通道时默认只考虑 Flutter；只要有原生方法交互就按 App 内嵌 H5 考虑真实 WebView 和键盘遮挡风险；包含真实输入框时必须处理 App WebView 键盘遮挡，并兼容内部滚动容器；普通进件需求复用现有 API，只有明确新文档/新字段替换时才先调用 h5-api-mapping；未明确国家差异时使用通用 Apply 流程，不套用危地马拉 profile；如明确需要飞书前端告警，调度 h5-feishu-alert；首贷/复贷状态流不使用本 skill。"
