interface:
  display_name: "H5 进件流程"
  short_description: "开发 H5 进件申请流程"
  default_prompt: "使用 h5-apply-flow 开发或修改 H5 进件申请流程；先读取 references/flow-variants.md 判断旧流程还是新流程，并按需读取 personal-ai-kb/Work/H5/业务场景/进件流程.md。参考项目不可用时不阻断，按抽象合同和目标项目证据执行。进件是业务场景，可能是独立 H5，也可能是 App 内嵌 H5，只有出现原生方法、bridge 或 window 回调证据时才判定为 App 内嵌；涉及 App WebView 时读取 Work/H5/公共规范/App WebView兼容.md，并遵守 references/native-methods.md；涉及拍照图片质量或截图预算时读取 Work/H5/公共规范/视觉还原与截图预算.md；未主动说明通道时默认只考虑 Flutter。普通进件需求复用现有 API；涉及接口 contract、新字段、新接口、app-specific 原生协议或配置差异时，先调用 api-kb-contract-reader 读取 Work/API/apps/<appName> 的 app 文档和命中 contract，KB 缺失则调用 api-doc-kb-archiver 入库，需要 H5 字段落地时再调用 h5-api-mapping。进件回显、配置解析、保存参数和编辑场景若接口文档、KB contract、用户确认样例或类型已明确具体结构，必须按固定结构读取，不写旧字段 fallback、多格式探测或本地静态业务兜底；进件选项字段若 contract 标注了获取实时配置参数/步骤配置 code，必须按该配置接口取值，配置项 code、枚举值和字段含义严格按当前 app API contract，不因参考项目、历史代码、运行时错位或临时返回现象反向调换 code；base64 解码后的字段也按当前 app contract 直接使用，不重组为旧项目别名，设计图不作为业务数据兜底；进件功能差异按 appName 读取 KB app 文档和项目代码；如明确需要飞书前端告警，调度 h5-feishu-alert；首贷/复贷状态流不使用本 skill。"
