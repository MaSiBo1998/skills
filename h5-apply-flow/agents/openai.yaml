interface:
  display_name: "H5 进件流程"
  short_description: "开发 H5 进件申请流程"
  default_prompt: "使用 h5-apply-flow 开发或修改 H5 进件申请流程；先读取 references/flow-variants.md 判断旧流程还是新流程，并按需读取 personal-ai-kb/Work/H5/业务场景/进件流程.md，不按 appName 自动追加 app 专属页。参考项目不可用时不阻断，按抽象合同和目标项目证据执行。进件是业务场景，可能是独立 H5，也可能是 App 内嵌 H5，只有出现原生方法、bridge 或 window 回调证据时才判定为 App 内嵌；涉及 App WebView 时读取 Work/H5/公共规范/App WebView兼容.md，并遵守 references/native-methods.md；涉及拍照图片质量或截图预算时读取 Work/H5/公共规范/视觉还原与截图预算.md；未主动说明通道时默认只考虑 Flutter。普通进件需求复用现有 API，涉及接口 contract 或新字段替换时先调用 api-kb-contract-reader 读取 Work/API/apps/<appName>，KB 缺失则调用 api-doc-kb-archiver 入库，需要 H5 字段落地时再调用 h5-api-mapping；未明确国家差异时使用通用 Apply 流程，不套用危地马拉 profile；如明确需要飞书前端告警，调度 h5-feishu-alert；首贷/复贷状态流不使用本 skill。"
