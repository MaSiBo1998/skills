interface:
  display_name: "H5 API Contract 落地"
  short_description: "根据 KB contract 迁移 H5/API 字段"
  default_prompt: "使用 h5-api-mapping 根据 KB contract 落地 H5 API 字段；实现前先调用 api-kb-contract-reader 按 appName 读取 API/apps/<appName> 的命中 contract，本地 swaggerApi.json、api.json、api.md、api.html 或用户临时接口文档只能先交给 api-doc-kb-archiver 入库，不能直接作为实现依据；字段、path、header、request key、response key、状态枚举和业务判断均以该 app 的 contract 为准；需要 baseURL、header、响应码时读取 全局配置.md，需要 WebView/Native 字段时读取 原生交互.md；本 skill 只负责 H5 service/types/model/hook/page 的字段落地，同结构混淆替换只替换接口地址、请求头、请求入参、响应字段 key 和全局配置字段，不改业务流程、不改结构；API base URL、后端接口地址、固定请求头值、国家/产品差异优先收敛到 .env* 或项目现有配置层；管理后台接口字段替换可复用落地方法，但后台页面实现仍归属 admin-management-flow。"
