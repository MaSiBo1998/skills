interface:
  display_name: "H5 Release Tag 兼容入口"
  short_description: "旧 H5 发布入口；新 workflow 优先使用 release-tag"
  default_prompt: "这是 h5-release-tag 兼容入口；新 workflow 优先使用 release-tag。若旧流程仍调度本 skill，则先说明本 skill 只做旧引用兼容，并按 release-tag 的同一套发布流程执行构建校验、git 发布前检查、提交发布改动、生成 Release Tag 并推送；生成 tag 前先 git fetch --tags；不要判断普通业务交付是否应该发布，也不要用 reset、强推或覆盖远端标签处理冲突。若本 skill 与 release-tag 规则不一致，以 release-tag 为准并提出 Workflow 沉淀提案。"
