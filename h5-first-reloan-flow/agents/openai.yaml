interface:
  display_name: "H5 首复贷状态流"
  short_description: "独立开发 H5 首贷/复贷状态流、订单详情和还款"
  default_prompt: "使用 h5-first-reloan-flow 开发或修改 H5 首贷/复贷状态流、产品详情、未确认贷款、放款、还款、支付过渡页、App 列表、原生交互和风控上传；先读取 references/flow-variants.md，并按需读取 personal-ai-kb/Work/H5/业务场景/首复贷状态流.md。首复贷是业务场景，可能是独立 H5，也可能是 App 内嵌 H5，只有出现原生方法、bridge 或 window 回调证据时才判定为 App 内嵌；涉及 App WebView 时读取 Work/H5/公共规范/App WebView兼容.md，并遵守 h5-apply-flow/references/native-methods.md；涉及设计图或截图时读取 Work/H5/公共规范/视觉还原与截图预算.md。状态流里可以展示或跳转进件入口，但不实现 Apply 表单步骤；按设计图改首复贷状态页时保留已有 banner、轮询、bridge 跳转、按钮回调、刷新逻辑和埋点，除非用户明确要求删除；同文件多状态分支只改目标状态分支；还款/支付过渡页重点检查复制兜底、服务费、渠道图标、空字符串渠道、顶部返回和 window.onNativeBack 同入口。普通首复贷需求复用现有流程，只有明确接口 contract / 新字段替换时才调用 api-kb-contract-reader 读取 Work/API/apps/<appName>，KB 缺失先用 api-doc-kb-archiver 入库，需要 H5 字段落地时再调用 h5-api-mapping；如明确需要飞书前端告警，调度 h5-feishu-alert。"
