interface:
  display_name: "H5 首复贷状态流"
  short_description: "独立开发 H5 首贷/复贷状态流、订单详情和还款"
  default_prompt: "使用 h5-first-reloan-flow 开发或修改 H5 首贷/复贷状态流、产品详情、未确认贷款、放款、还款、支付过渡页、App 列表、原生交互和风控上传；先读取 references/flow-variants.md 判断旧流程还是新流程，当前已沉淀规则默认归属新流程，旧流程参考项目待用户补充；参考项目不可用时不阻断，按抽象合同和目标项目证据执行。首复贷是业务场景，可能是独立 H5，也可能是 App 内嵌 H5，只有出现原生方法、bridge 或 window 回调证据时才判定为 App 内嵌；涉及原生交互时必须遵守 h5-apply-flow/references/native-methods.md，未主动说明通道时默认只考虑 Flutter，不额外添加 Android/iOS/Web 分支；状态流里可以展示或跳转进件入口，但不实现 Apply 表单步骤；按设计图改首复贷状态页时，设计图只作为主体视觉依据，保留当前代码已有的 BannerRail、状态轮询、bridge 跳转、按钮回调、刷新逻辑和埋点，除非用户明确要求删除；同文件多状态分支只改目标状态分支；只要涉及原生方法交互就按 App 内嵌 H5 考虑键盘遮挡风险，还款页如包含真实输入框，必须检查 App WebView 键盘遮挡、内部滚动容器和 visualViewport 失效兜底；还款支付过渡页必须检查非 URL 凭证复制兜底、服务费展示、渠道图标资源、空字符串渠道提示，以及顶部返回、页面按钮和 window.onNativeBack 是否共用同一个 H5 返回入口；首复贷 banner 内跳参数按接口原值透传给 bridge，不在 H5 层擅自解析或改变格式；KB contract、用户示例或现有类型已明确接口结构时按固定结构直接取值或解析，避免复杂通用兜底、多层 helper 或本地业务文案替代接口文案；接口返回格式已确定时只读约定字段，例如错误提示只返回 msg 时不得额外兜底读取 message 或旧字段；旧 WebView 兼容需检查关键布局不依赖 gap，safe-area padding 有固定值、constant()、env() 分层兜底；参考项目字段只能用于理解语义，用户或 KB contract 给出真实字段后必须清理旧字段兼容读取；普通首复贷需求复用现有流程，只有明确接口 contract / 新字段替换时才先调用 api-kb-contract-reader，KB 缺失先用 api-doc-kb-archiver 入库，需要 H5 字段落地时再调用 h5-api-mapping；如明确需要飞书前端告警，调度 h5-feishu-alert。"
