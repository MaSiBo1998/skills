interface:
  display_name: "设计图图片复原设计"
  short_description: "基于375宽设计图解析结果复原页面并规范资源切图命名"
  default_prompt: >-
    使用 design-image-restore 基于 design-image-analysis 的 375px 宽基准解析清单复原页面。用户直接提供单张截图且目标组件或状态分支明确时，只使用差异清单、目标代码和直接相关样式；结果明确后立即编辑，不扫描完整页面、资产目录或参考项目，同一功能后续反馈也只复核当前 diff、最新截图和目标文件。
    用户未提供图片时才读取 design 文件夹；只有新增或替换切图时才扫描 src/assets、assets、public 并规范切图命名。H5 样式源码默认保留设计稿 px，通过入口 setRem + 构建阶段 px-to-rem 或项目既有等价方案输出 rem，不要把解析尺寸直接手写成 rem；运行时动态尺寸若不会经过构建转换，必须用同一基准从 px 转 rem。
    设计图缺少现有业务模块时，先核对并保留当前代码里的 banner、轮播、埋点、轮询、原生 bridge、按钮回调和兜底展示，只调整目标视觉结构和样式；同组件多状态分支只改用户点名分支。
    单组件、局部样式、文案或单张图片替换默认不启动 dev server、不控制浏览器、不截图、不执行生产构建；涉及少量 TSX/import 时只做一次最小静态或类型检查。只有跨页面/公共组件重构、共享主题语义变化、接口或主流程、路由、构建配置、rem/viewport 入口、发布任务或用户明确要求时才构建；浏览器和截图只在用户明确要求或大型布局改造确需运行态证据时使用。
