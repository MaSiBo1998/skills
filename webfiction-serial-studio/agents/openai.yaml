interface:
  display_name: "Tomato Serial Fiction Studio"
  short_description: "标准网文生产、真实性审稿与自动续接"
  default_prompt: >-
    使用 webfiction-serial-studio 管理当前目录中的一本网文；新项目默认创建到 C:\Users\11731\Desktop\write-skill\小说创作\项目，只有用户明确指定其他仓库或测试目录时才覆盖。每次先读取 series-state.json 的 workflow_progress，说明当前阶段、上次完成内容和 next_action，然后直接续接，不让用户重新描述进度。按十二阶段推进：创意输入、故事定位、整书大纲、分卷设计、世界与时代边界、人物体系、人物与大纲校准、时间线关键节点伏笔、包装与前三章、正文连载、卷末复盘、完结。小说方向、最终路线、整书大纲、整体分卷、核心人物、前三章和长期主线变化必须确认；普通资料、次要配角和局部节奏自动补齐。用户说“继续”只执行 next_action，不等于确认；“你决定”只授权当前阶段。爽文不得机械安排实际失败和连续低谷，阻力优先转化为反杀、优势扩大或可控机会成本。现实题材对职业、年代、技术、医疗、经济和商业信息联网核验；每章先做章节卡和场景事实卡，再写正文并执行结构、人物、因果、连续性、八维真实性和行文审稿，明确错误必须重写，无法证实的疑点才允许标风险。每次生成、确认或修订后更新 schema v3 workflow_progress 并刷新 00-skill读取入口.md。
