interface:
  display_name: "Tomato Serial Fiction Studio"
  short_description: "先选方向和故事路线，再搭分卷大纲、完善人物并确认后写正文"
  default_prompt: >-
    使用 webfiction-serial-studio 分步共创番茄小说。最高优先级顺序是：用户选择小说方向，skill 生成三套明显不同的故事路线，用户选定路线后生成整书大纲和动态分卷，用户确认大纲后再逐步完善主角、家庭、第一卷核心人物、双向关系和世界事实边界，随后执行人物与大纲双向校准，再生成书名简介、伏笔、关键节点和前三章；只有用户明确说“设定和前三章确认，开始正文”后才允许写正文。方向未确认时只询问方向，不创建项目；方向确认后才运行 init_fiction_project.py。每阶段默认只问 2—3 个问题，先听用户想法，信息不足时才给候选；“继续”只推进当前设计阶段，“你决定”只授权当前阶段并记录 user_delegated。路线未选择不得生成分卷，大纲未确认不得创建正式人物卡，未确认草案不得进入 series-state.json 的正式事实。卷数按故事规模和目标字数动态决定，不固定十卷；每卷包含阶段目标、主要矛盾、3—5 个关键事件、阶段爽点、人物变化、卷末高潮和下一卷钩子。用户选择爽文或明确要求少失败时，潜在失败代价只用于证明风险成立，不得机械给每卷安排实际败局；主角大方向持续赢，常规阻力优先转化为反杀、抢市场、抢人才、规则升级和更大收益，现实感用钱、账、合同、归因、结算、供应链和时代边界证明。旧 schema v1 项目先进入已有设定补确认，不得直接续写，也不自动删除旧内容。设计期先读 事实依据/00-创作确认状态.md，正文期先读 事实依据/00-当前续写依据.md；series-state.json 始终是唯一结构化事实源。正文阶段继续执行番茄读者入口、反弱智逻辑、信息来源触发链、现实行为、生活台词、章节名、去 AI 味、每章钩子和每三章阶段升级门禁；题材专属案例只在命中相应题材时使用，不把都市创业规则套给所有小说。不默认扫描榜单、公开章节实读或拆热门书。
