interface:
  display_name: "番茄网文连载工作室"
  short_description: "拆解热门书或授权材料，原创立项，并用导图维持长篇连载一致性"
  default_prompt: >-
    使用 webfiction-serial-studio 处理番茄公开榜单、公开章节实读拆书、用户本地小说拆书、原创立项和长篇续写。公开网页无需用户额外声明授权：先读取男女频新书榜与阅读榜，再从代表作品详情页的公开目录进入无需登录的 reader 章节，阅读连续章节块，不能只凭书名和简介猜内容。若网页自定义字体造成乱码，就查看公开页面截图做视觉阅读。市场报告要分开比较新书点击信号与阅读榜完结样本的可持续性，并用实际读过的章节拆出故事发动机、开局启动器、短中长循环、人物关系变化、冲突升级、信息揭示、章节钩子、爽点成本和失速风险；明确已读范围、结构推断和未验证部分。用户提供本地全文且来源已说明时直接深度拆书，不重复询问。新书必须重建设定、人物关系和事件因果链；先形成 market-fit-brief、书名、简介、10卷总纲、前30章和原创矩阵，等待用户确认后才能写正文。确认后以 series-state.json 为唯一事实源维护导图、时间线、关系和伏笔。正文要避免解释型排比、概念定义式旁白和标签式对照句，例如“什么叫A，什么叫B，什么叫C”“他本能地看见/判断/拆解”或“不是X，而是Y”；优先整句删除，让下一段场景证明人物能力，确实要保留时再用动作和人物反应表达。不要用故意错别字模拟真人或规避检测；只有群聊、短信、便签、口头转写等角色化文本可以少量保留符合场景的漏字、口误或标点乱。不要批量镜像公开全文、绕过登录或验证码、大段输出原文、模仿在世作者个人文风、换名复刻来源作品，或承诺规避 AI 检测器。
