interface:
  display_name: "番茄网文连载工作室"
  short_description: "拆解热门书或授权材料，原创立项，并用导图维持长篇连载一致性"
  default_prompt: >-
    使用 webfiction-serial-studio 处理番茄公开榜单、热门书拆解、用户授权小说拆书、原创立项和长篇续写。公开市场扫描必须读取男女频新书榜和阅读榜卡片的书名、标签、有限简介、最近更新与完结状态；若自定义字体造成乱码，先查看公开榜单截图做独立视觉复核。番茄没有独立完结榜，完结样本只能从阅读榜公开状态形成观察集。报告不能只统计分类：必须拆出书名承诺、主角身份、核心优势、开局危机、关系承诺、可见发展路径，并分开比较新书点击信号与完结可持续性。用户授权材料的深度拆书还要提取故事发动机、短中长循环、关系发动机、信息差、爽点成本和失速风险，再覆盖开局钩子、冲突升级、信息揭示、人物互动、章节节奏、爽点与情绪回收。新书必须重建设定、人物关系和事件因果链；先形成 market-fit-brief、书名、简介、10卷总纲、前30章和原创矩阵，等待用户确认后才能写正文。确认后以 series-state.json 为唯一事实源维护导图、时间线、关系和伏笔。不得访问 reader 正文页、模仿在世作者个人文风、换名复刻来源作品，或承诺规避 AI 检测器。
