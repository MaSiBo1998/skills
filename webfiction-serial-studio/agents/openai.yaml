interface:
  display_name: "番茄发表向小说创作工作室"
  short_description: "根据用户提示生成番茄小说项目、导图、伏笔、事实依据和长篇正文"
  default_prompt: >-
    使用 webfiction-serial-studio 处理面向番茄发表的原创小说生成、长篇项目初始化、书名简介、前三章启动器、卷纲/章节计划、关键节点、关键人物关系、伏笔、事实依据、导图、正文续写和一致性审稿。默认目标是最大可能让更多读者点开并继续阅读：书名要有读者承诺，简介要让人立刻知道主角是谁、遭遇什么、能爽在哪里、后续为什么值得追；前三章必须快速完成危机、欲望、能力边界、第一波爽点和下一章钩子。不要默认扫描榜单、公开章节实读、拆热门书、授权拆书或输出原创分离矩阵；用户明确要求参考榜单或热门书时，才作为单独研究任务处理。项目默认生成中文目录：正文、计划、关键节点、关键人物关系、伏笔、事实依据、导图、审稿报告，并以 series-state.json 为唯一事实源。续写前必须校验状态、渲染导图，读取导图/chapter-context.md、事实依据、伏笔和关键人物关系；校验失败、项目未确认或事实冲突时不要输出正文。章节名必须像读者入口，提供读者承诺、冲突、爽点、悬念、身份反差或情绪钩子，不能像作者备注、产品流程、章节卡字段或 AI 总结；禁止“先别写代码，先看人怎么干活”“真实需求调研”“产品边界确定”这类内部工作流标题，保留“死在工位，醒在高考后”这类有画面、有反差、有情绪的方向。正文先过反弱智逻辑硬门禁：重大行动必须能说明眼前目标、直接利益、失败代价、人物经历和当前处境；都市重生创业早期主角优先动机通常是搞钱、买时间、买选择权和保家庭，不要自动美化成“帮助别人提高效率”或“让别人少犯错”。现实行为要像正常人会做的事，例如未发送辞职邮件草稿合理，把准备离职贴在工位上不合理；用户认可过的锋利表达如“人呢？”“人在死!”不要润成平庸旁白。正文还要避免解释型排比、概念定义式旁白和标签式对照句，例如“什么叫A，什么叫B，什么叫C”“他本能地看见/判断/拆解”或“不是X，而是Y”；优先整句删除，让下一段场景证明人物能力，确实要保留时再用动作和人物反应表达。每章结尾必须有具体未解问题、利益变化、关系变化、危机升级或爽点预告；每三章必须形成阶段升级，不能只原地聊天、解释设定或重复震惊。
