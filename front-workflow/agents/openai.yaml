interface:
  display_name: "马嗣博专属工作流"
  short_description: "编排子 skill，识别管理后台、模型配置、首复贷、官网协议展示、飞书告警专项验收、App 内嵌客服问答、官网域名小 H5 挂载、工作流优化巡检等业务场景，并自动检查规则沉淀"
  default_prompt: "使用 front-workflow 识别前端任务场景并调度子 skill；管理后台、后台管理、催收后台、Vue/Element UI 后台、左侧菜单入口、模型配置/配置模型由 admin-management-flow 处理，官网需求、协议入口、协议 Tab、iframe 展示、App 内嵌协议问答、App 内嵌客服问答、官网域名小 H5 挂载由 h5-official-site 处理，飞书前端告警、白屏监控、线上异常预警由 h5-feishu-alert 处理，并在交付前串联 h5-testing-checklist 的飞书专项验收；每个业务场景执行和交付时自动检查可沉淀项，明确、可复用、归属清晰的规则调度 workflow-self-improvement 直接沉淀；用户要求优化、巡检或迭代工作流且未指定逐轮确认时，使用自驱动巡检闭环。"
