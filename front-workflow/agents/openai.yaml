interface:
  display_name: "马嗣博专属工作流"
  short_description: "工作类请求默认入口；支持小需求、普通修改、走工作流、归类和判断 skill"
  default_prompt: >-
    使用 front-workflow 作为工作类请求默认入口和主编排骨架；代码、项目、skill、workflow、H5、后台、Flutter、发布、发版检查、发布前检查、检查 vConsole、检查能不能发版、设计图、接口、小需求、普通修改、帮我修一下、改个文案、改个样式、补个字段、接个接口等请求默认先进入本 skill。用户显式说“走工作流、按我的工作流、按流程来、用主工作流、帮我归类、判断走哪个 skill、这个需求该归哪、按你的 workflow 处理”时必须进入本 skill。不要把它当成方向内实现手册。进入后先输出简短状态条：工作流已接管｜触发=自动/显式｜方向=...｜场景=...｜验收=quick/focused/full/release｜知识库=待判断/已读取/跳过｜沉淀=待判断。先读取 references/orchestrator-contract.md，再读取 references/direction-registry.md，然后根据 primary_direction 进入对应 scene map；当前 active 方向是 frontend 和 workflow/meta：frontend 使用 references/frontend-scene-map.md，workflow/meta 使用 references/workflow-meta-scene-map.md。发版检查、发布前检查、检查 vConsole 或检查能不能发版时，Scene G 只调度 release-precheck 做只读 readiness 检查，不提交、不打 tag、不推送；只有用户确认正式发布后才进入 release-tag。按 knowledge_layer 判断是否读取个人知识库 D:\\code\\my-project\\personal-ai-kb：学习、解释、项目理解、踩坑复盘、概念类问题默认读取 README.md、Home.md 和对应方向 MOC；Flutter 读 12-Flutter学习/MOC.md，Java/后端读 15-Java学习/MOC.md，前端/H5/后台读 10-前端工程/MOC.md，AI 读 20-AI应用工程/MOC.md；不确定方向先读 README.md 和 Home.md 再搜索定位。Scene B 普通 H5 功能/API 开发若触及页面、路由、hook、组件、API、登录态、原生返回、埋点、i18n/格式化、环境配置或 App WebView 行为，按需读取 references/h5-common-feature-flow.md 作为轻量基线。先读取用户需求、当前目录、项目结构、路由、接口、配置、design 目录、release-env、checkpoint；若上下文包含 Automation ID、Automation memory 或上次运行时间，先读取对应 automation memory。方向优先于场景，触发词只是信号，弱触发词只能形成候选，不能直接决定最终归属。先确定 primary_direction / candidate_directions，再确定 primary_scene / candidate_scenes，把设计图、接口文档、告警、vendor、发布配置等默认降级为 supporting_capabilities。执行链按“输入补齐 -> 前置约束 -> 核心实现 -> 风险附加 -> 验收收口”的最小可行链拼装，小需求按风险选择 quick 或 focused，不机械升级成重流程。普通业务任务收口时必须执行 learning_gate；若发现学习笔记、项目理解或踩坑复盘候选，输出 KB 沉淀提案，说明目标知识库文件、摘要、证据和风险，等待用户确认后才写入 personal-ai-kb；若发现 workflow 触发、验收或 skill 调度规则候选，输出 Workflow 沉淀提案，等待用户确认后才交给 workflow-self-improvement 修改、quick_validate、补回归并同步运行时。若命中 workflow/meta，读取 workflow-meta-scene-map.md；指导意见、分类归属、触发准确性、skill 体系设计或工作流体检先交给 skill-workflow-advisor 诊断；用户确认沉淀、修 skill、补回归、同步运行时后再交给 workflow-self-improvement。backend/flutter 当前是 planned 扩展位；遇到这两个方向时，先做最小探索和轻量 spec，不伪装成已支持的完整 workflow。
