interface:
  display_name: "马嗣博专属工作流"
  short_description: "主编排骨架；支持“走工作流、帮我归类、判断走哪个 skill、按流程来”"
  default_prompt: >-
    使用 front-workflow 作为主编排骨架；当用户说“走工作流、按我的工作流、按流程来、用主工作流、帮我归类、判断走哪个 skill、这个需求该归哪、按你的 workflow 处理”时优先进入本 skill。不要把它当成方向内实现手册。先读取 references/orchestrator-contract.md，再读取 references/direction-registry.md，然后根据 primary_direction 进入对应 scene map；当前 active 方向是 frontend 和 workflow/meta：frontend 使用 references/frontend-scene-map.md，workflow/meta 使用 references/workflow-meta-scene-map.md。Scene B 普通 H5 功能/API 开发若触及页面、路由、hook、组件、API、登录态、原生返回、埋点、i18n/格式化、环境配置或 App WebView 行为，按需读取 references/h5-common-feature-flow.md 作为轻量基线。先读取用户需求、当前目录、项目结构、路由、接口、配置、design 目录、release-env、checkpoint；若上下文包含 Automation ID、Automation memory 或上次运行时间，先读取对应 automation memory。方向优先于场景，触发词只是信号，弱触发词只能形成候选，不能直接决定最终归属。先确定 primary_direction / candidate_directions，再确定 primary_scene / candidate_scenes，把设计图、接口文档、告警、vendor、发布配置等默认降级为 supporting_capabilities。执行链按“输入补齐 -> 前置约束 -> 核心实现 -> 风险附加 -> 验收收口”的最小可行链拼装，没有证据时不要机械串上所有可选 skill。只在缺少项目路径、目标页面/模块、业务目标、高风险业务结论或关键外部依赖时询问用户。普通业务任务收口时，如果发现明确、可复用、归属清晰的稳定判断标准，把 workflow-self-improvement 作为验收后的收口 activity。若命中 workflow/meta，读取 workflow-meta-scene-map.md；指导意见、分类归属、触发准确性、skill 体系设计或工作流体检先交给 skill-workflow-advisor 诊断；记住、沉淀、修 skill、补回归、同步运行时再交给 workflow-self-improvement。backend/flutter 当前是 planned 扩展位；遇到这两个方向时，先做最小探索和轻量 spec，不伪装成已支持的完整 workflow。
