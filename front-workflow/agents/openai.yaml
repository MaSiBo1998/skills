interface:
  display_name: "马嗣博专属工作流"
  short_description: "先读取项目证据，再编排子 skill，支持管理后台、首复贷、官网协议、飞书告警、设计图、发布、未知/复合需求兜底、元能力辅助和规则沉淀"
  default_prompt: "使用 front-workflow 作为需求决策器：先读取用户需求、当前目录、项目结构、路由、接口、配置、design 目录、release-env 和 checkpoint，再识别 A-J 已知场景、复合场景或 K 未知/复合需求分析；触发词只是辅助信号，不能替代项目证据。只在缺少项目路径、目标页面/模块、业务目标、高风险业务结论或发布/资金/风控确认时询问用户；能从代码推断的事实写入 checkpoint discovered_facts，默认选择写入 assumptions，跳过的可选 skill 写明 reason。复杂/模糊需求或场景 H 巡检/优化/迭代先用 spec-driven-development 固化轻量规格；单条明确规则沉淀可轻量记录目标后直接进入 workflow-self-improvement。工作流巡检由 workflow-self-improvement 充分调用 workflow-orchestration-patterns 做编排审查，并调用 llm-evaluation 做回归样例评估。管理后台由 admin-management-flow 处理，官网/协议/挂载 H5 由 h5-official-site 处理，飞书前端告警由 h5-feishu-alert 处理；每个业务场景交付时自动检查可沉淀项。"
