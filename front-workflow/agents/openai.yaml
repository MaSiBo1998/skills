interface:
  display_name: "马嗣博专属工作流"
  short_description: "先读取项目证据，再编排子 skill，支持管理后台、首复贷、官网协议、飞书告警、设计图、发布、未知/复合需求兜底、元能力辅助和规则沉淀"
  default_prompt: >-
    使用 front-workflow 作为需求决策器：先读取用户需求、当前目录、项目结构、路由、接口、配置、design 目录、release-env、checkpoint；若上下文包含 Automation ID、Automation memory 或上次运行时间，先读取对应 automation memory，路径优先解析上下文显式值并使用解析结果；显式值里的 CODEX_HOME 未解析或环境变量为空时，回退到用户目录下 .codex/automations/<id>/memory.md；未提供显式值时才使用默认 CODEX_HOME automation 路径，避免重复处理已确认的漂移、阻塞和已完成修复；再识别 A-J 已知场景、复合场景或 K 未知/复合需求分析。触发词只是辅助信号，不能替代项目证据。只在缺少项目路径、目标页面/模块、业务目标、高风险业务结论或发布/资金/风控确认时询问用户；能从代码推断的事实写入 checkpoint discovered_facts，默认选择写入 assumptions，跳过的可选 skill 写明 reason。任何 H5 项目或页面改动都默认遵守 H5 基础质量要求：以 375px 宽设计图为基准，优先采用源码 CSS/SCSS 保留设计稿 px、入口 setRem 设置根字号、构建阶段 px-to-rem 输出 rem 的链路；不要把源码样式直接手写成 rem；运行时 JS 注入的动态尺寸或 CSS 变量若不经过构建转换，必须用同一基准工具从设计稿 px 转 rem；避免零散屏幕尺寸查询；首屏加载速度作为实现约束；样式按 base/layout/components/pages 等职责拆分，避免巨型样式文件。凡是证据显示页面会在 App 内嵌 WebView 打开，包括首复贷、进件、官网挂载小 H5、App 内嵌协议/客服、活动页等，交付前必须让 h5-testing-checklist 按 quick/focused/full/release 风险等级执行 App WebView 兼容和 H5 基础质量检查；纯样式/文案小改只做局部 diff 风险抽查，不要机械整体验收拖慢进度，也不能完全忽略 WebView 风险。复杂/模糊需求或场景 H 巡检/优化/迭代先用 spec-driven-development 固化轻量规格；单条明确规则沉淀可轻量记录目标后直接进入 workflow-self-improvement。工作流巡检由 workflow-self-improvement 充分调用 workflow-orchestration-patterns 做编排审查，并调用 llm-evaluation 做回归样例评估。管理后台由 admin-management-flow 处理，官网/协议/挂载 H5 由 h5-official-site 处理，飞书前端告警由 h5-feishu-alert 处理；每个业务场景交付时自动检查可沉淀项。
