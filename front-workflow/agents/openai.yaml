interface:
  display_name: "马嗣博专属工作流"
  short_description: "工作类请求默认入口；支持小需求、普通修改、走工作流、归类和判断 skill"
  default_prompt: >-
    使用 front-workflow 作为工作类请求默认入口。代码、项目、skill、workflow、H5、后台、Flutter、发布/发版检查、设计图、接口、小需求、普通修改、文案/样式/字段调整等请求，必须先进入本 skill；用户显式说“走工作流/按流程/用主工作流/帮我归类/判断走哪个 skill”时也必须进入。开始时输出状态条：工作流已接管｜触发=自动/显式｜方向=...｜场景=...｜验收=quick/focused/full/release｜知识库=待判断/已读取/跳过｜沉淀=待判断。
    按顺序读取 references/orchestrator-contract.md、direction-registry.md、knowledge-layer.md，再按方向读取 frontend-scene-map.md 或 workflow-meta-scene-map.md；普通 H5 横切需求按需读 h5-common-feature-flow.md，H5 需求按 h5-constraint-areas.md 判定 constraint_areas/form-input/interaction/webview/visual-layout/assets-performance/api-data，执行链规则读 execution-chain.md，收口沉淀读 learning-gate.md。方向先于场景，业务场景先于公共约束区域，触发词只是候选；设计图、接口文档、告警、vendor、发布配置默认是 supporting_capabilities。
    目标组件和业务分支明确的小需求进入快速通道并立即实现：平台要求的 skill 入口和路由 reference 读取不计入预算，进入目标项目后最多执行 2 批业务探索且最多采用 1 个强参考来源；但出现项目名、App 名、官网、协议或公司官网时，必须先完成 KB 项目定位并记录 `context.project_resolution`，未确定 `selected_path` 和 `selection_reason` 时不得把 evidence_ready 设为 true 或进入编辑。目标文件、目标分支、预期结果、风险等级明确并且无阻塞项时，下一项工作动作必须是编辑，不得继续重复视觉推理或扩大扫描。进入快速通道时必须初始化 checkpoint `context.fast_lane_guard`，每批探索后立即更新批次、强参考来源、证据状态和下一动作，并向 completed_steps 追加该批快照；目标代码、用户材料、KB contract 或外部参考实现的读取计入业务探索，平台强制 skill/reference、checkpoint、Git 状态和实现后验收不计入。两批后仍不明确则写明 exit_reason 并退出快速通道；仍在快速通道却超过两批、证据已齐仍探索、或批次用满未进入 edit/exit_fast_lane 时，写入 violation 并立即停止新增探索。同一功能的后续局部反馈只复核当前 diff、最新材料和目标文件，不重新做完整页面分析、资产扫描或参考项目检索。
    局部样式、文案、单张图片替换和单组件调整默认 quick，涉及少量 TSX/import 最多 focused 并只做一次最小静态或类型检查；只有跨页面/公共组件重构、共享主题语义变化、接口或主流程、路由、构建配置、rem/viewport 入口、发布任务或用户明确要求时才执行生产构建，浏览器和截图只在用户明确要求或大型布局改造确需运行态证据时使用。
    涉及项目名、App 别名、本地目录、官网、协议、公司官网、投放、还款或 H5 项目定位时，必须读取 personal-ai-kb/Work/MOC、Work/Projects/MOC 和对应分类页，按 KB 用途字段定位并记录 `project_resolution`；普通“官网/协议”选择标记为官网/协议项目的仓库，只有明确“公司官网”或公司主体时才选择 `*-company`，禁止根据目录后缀猜测，也不能因改动机械或低风险而标记知识库跳过。若只出现 co6/co4/mx1 等 API alias，先用 Work/API/apps/_app-index.jsonl 解析 appName，再回到 Work/Projects/H5.md 定位具体项目。接口实现必须以 personal-ai-kb/Work/API/apps/<appName> 的 KB contract 为准：先用 api-kb-contract-reader，KB 缺失再用 api-doc-kb-archiver 入库，本地 swagger/api 文档不能直接实现；H5 公共场景知识读 personal-ai-kb/Work/H5，例如表单交互、进件、首复贷、App WebView、视觉还原和截图预算，API 模块只放接口事实。
    发版检查只调度 release-precheck；用户确认正式发布后才进入 release-tag。普通业务收口必须执行 learning_gate：KB 笔记和 workflow 规则分开提案，用户确认前不得写 personal-ai-kb 或 Desktop\skills。workflow/meta 诊断先用 skill-workflow-advisor；明确修改、沉淀、补回归、同步运行时再用 workflow-self-improvement。backend/flutter 当前按 planned 方向做最小探索，不伪装成已完整支持。
