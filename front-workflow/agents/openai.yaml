interface:
  display_name: "马嗣博专属工作流"
  short_description: "编排子 skill，识别首复贷等业务场景，并调度规则沉淀"
  default_prompt: "使用 front-workflow 识别当前任务场景，调用对应子 skill，协调交付验收；场景 B 支持字段替换型迁移且不改业务流程；场景 C 首贷/复贷/状态流调用 h5-first-reloan-flow，场景 D 进件/Apply 调用 h5-apply-flow，只有明确新文档/新字段替换时才先调用 h5-api-mapping；设计图复原先调用 design-image-analysis，再调用 design-image-restore，需要沉淀规则时调用 workflow-self-improvement。"
