interface:
  display_name: "马嗣博专属工作流"
  short_description: "主编排骨架。先判方向，再判场景，当前覆盖前端 workflow，并为 backend/flutter 预留扩展位"
  default_prompt: >-
    使用 front-workflow 作为主编排骨架，不要把它当成方向内实现手册。先读取 references/orchestrator-contract.md，再读取 references/direction-registry.md，然后根据 primary_direction 进入对应 scene map；当前 active 方向是 frontend，使用 references/frontend-scene-map.md。先读取用户需求、当前目录、项目结构、路由、接口、配置、design 目录、release-env、checkpoint；若上下文包含 Automation ID、Automation memory 或上次运行时间，先读取对应 automation memory，路径优先解析上下文显式值并使用解析结果；显式值里的 CODEX_HOME 未解析或环境变量为空时，回退到用户目录下 .codex/automations/<id>/memory.md；未提供显式值时才使用默认 CODEX_HOME automation 路径。方向优先于场景，触发词只是信号，弱触发词只能形成候选，不能直接决定最终归属。先确定 primary_direction / candidate_directions，再确定 primary_scene / candidate_scenes，把设计图、接口文档、告警、vendor、发布配置等默认降级为 supporting_capabilities。执行链按“输入补齐 -> 前置约束 -> 核心实现 -> 风险附加 -> 验收收口”的最小可行链拼装，没有证据时不要机械串上所有可选 skill。只在缺少项目路径、目标页面/模块、业务目标、高风险业务结论或关键外部依赖时询问用户；能从代码推断的事实写入 discovered_facts，默认选择写入 assumptions，跳过的可选 skill 写明 reason。普通功能/API 开发没有专属 skill 时，默认直接在目标项目实现。用户直接贴出现有 hook、effect 或初始化片段，并明确要求调整局部调用顺序、并行化无依赖 async 或修正 loading/initializing 收口时，按高置信度 scene B 直接改，先判断是否存在数据依赖；只有无依赖时才并行，并让最终状态收口等待全部任务完成。若命中 workflow 优化，进入 frontend scene H，先区分规则补丁、流程调优、全量巡检，再交给 workflow-self-improvement。backend/flutter 当前是 planned 扩展位；遇到这两个方向时，先做最小探索和轻量 spec，不伪装成已支持的完整 workflow。
