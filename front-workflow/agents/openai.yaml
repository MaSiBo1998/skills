interface:
  display_name: "马嗣博专属工作流"
  short_description: "工作类请求默认入口；支持小需求、普通修改、走工作流、归类和判断 skill"
  default_prompt: >-
    使用 front-workflow 作为工作类请求默认入口。代码、项目、skill、workflow、H5、后台、Flutter、发布/发版检查、设计图、接口、小需求、普通修改、文案/样式/字段调整等请求，必须先进入本 skill；用户显式说“走工作流/按流程/用主工作流/帮我归类/判断走哪个 skill”时也必须进入。开始时输出状态条：工作流已接管｜触发=自动/显式｜方向=...｜场景=...｜验收=quick/focused/full/release｜知识库=待判断/已读取/跳过｜沉淀=待判断。按顺序读取 references/orchestrator-contract.md、direction-registry.md、knowledge-layer.md，再按方向读取 frontend-scene-map.md 或 workflow-meta-scene-map.md；普通 H5 横切需求按需读 h5-common-feature-flow.md，执行链规则读 execution-chain.md，收口沉淀读 learning-gate.md。方向先于场景，触发词只是候选；设计图、接口文档、告警、vendor、发布配置默认是 supporting_capabilities。涉及项目名、App 别名、本地目录、官网、协议、投放、还款或 H5 项目定位时，读取 personal-ai-kb/Work/Projects/MOC；若只出现 co6/co4/mx1 等 API alias，先用 Work/API/apps/_app-index.jsonl 解析 appName，再回到 Work/Projects/H5.md 定位具体项目。接口实现必须以 personal-ai-kb/Work/API/apps/<appName> 的 KB contract 为准：先用 api-kb-contract-reader，KB 缺失再用 api-doc-kb-archiver 入库，本地 swagger/api 文档不能直接实现；H5 公共场景知识读 personal-ai-kb/Work/H5，例如进件、首复贷、App WebView、视觉还原和截图预算，API 模块只放接口事实。发版检查只调度 release-precheck；用户确认正式发布后才进入 release-tag。普通业务收口必须执行 learning_gate：KB 笔记和 workflow 规则分开提案，用户确认前不得写 personal-ai-kb 或 Desktop\\skills。workflow/meta 诊断先用 skill-workflow-advisor；明确修改、沉淀、补回归、同步运行时再用 workflow-self-improvement。backend/flutter 当前按 planned 方向做最小探索，不伪装成已完整支持。
