interface:
  display_name: "API KB Contract Reader"
  short_description: "跨端按 appName 从 KB 读取接口 contract"
  default_prompt: "Use $api-kb-contract-reader to read archived API contracts from D:\\code\\my-project\\personal-ai-kb\\Work\\API\\apps\\<appName>. First read the app README and _indexes/contracts.jsonl, by-path.json, or by-symbol.json, then open only the matched contracts/<Chinese purpose>.md files. Read 全局配置.md for baseURL/header/response codes and 原生交互.md only for app-specific Native methods, callbacks, or obfuscated fields. Do not read H5 public rules here; 进件、首复贷、App WebView、视觉还原、截图预算 live under personal-ai-kb/Work/H5 and are read by the main workflow or H5 skills. Do not archive, generate API docs, or implement business code here; use api-doc-kb-archiver for KB ingestion and hand contract evidence to the H5, Flutter, or admin workflow."
